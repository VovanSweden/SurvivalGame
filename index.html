<!DOCTYPE html>


<!--
=================================================

SURVIVE 30 DAYS

ФАЙЛ: index.html


Назначение:

Этот файл отвечает только за структуру
интерфейса игры.


Здесь создаются:

- экраны игры;
- текст;
- кнопки;
- места для картинок;
- игровые контейнеры.


Здесь НЕ будет:

- расчётов выживания;
- вероятностей;
- событий;
- подсчёта очков;
- игровой логики.


Вся логика будет находиться в:

game.js


=================================================
-->



<html lang="en">



<head>



<!--
=================================================
1. НАСТРОЙКИ СТРАНИЦЫ


Здесь находятся технические параметры.


Мы задаём:

- кодировку;
- адаптацию под мобильный экран;
- название игры;
- подключение CSS.


=================================================
-->



<meta charset="UTF-8">





<!--

Адаптация под телефон.

Этот параметр говорит браузеру:

"Используй настоящий размер экрана телефона".

Без него мобильная игра может выглядеть маленькой.

-->



<meta 
name="viewport" 
content="width=device-width, initial-scale=1.0">

<!--
=================================================

ПОДКЛЮЧЕНИЕ ИГРОВЫХ ШРИФТОВ


Используем два разных шрифта:


Cinzel:

Для:

- названия игры;
- логотипа;
- крупных заголовков.


Он создаёт атмосферу:

- приключения;
- исследования;
- выживания.


Inter:

Для:

- описаний;
- кнопок;
- обычного интерфейса.


Он хорошо читается
на маленьком экране телефона.


=================================================
-->


<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">






<!--

Название игры во вкладке браузера.

-->



<title>

SurvivalGame

</title>






<!--

Подключение файла дизайна.


style.css отвечает за:

- фон;
- размеры;
- расположение элементов;
- кнопки;
- визуальные эффекты.


=================================================
-->



<!--
=================================================

ПОДКЛЮЧЕНИЕ  ФАЙЛА STYLE.CSS


style.css отвечает за внешний вид игры.


Добавление:

?v=2


заставляет браузер загрузить
новую версию файла CSS,
а не использовать старую копию
из памяти телефона.


Когда в будущем CSS снова
не будет обновляться,
можно изменить:

?v=2

на:

?v=3

потом:

?v=4


=================================================
-->


<link rel="stylesheet" href="style.css?v=2">



</head>








<body>







<!--
=================================================

2. ГЛАВНЫЙ КОНТЕЙНЕР ИГРЫ


.game


Это главный контейнер всей игры.


Внутри него будут переключаться
разные игровые экраны.


Структура будущей игры:


.game

    |
    |
    ├── start-screen
    |
    ├── character-screen
    |
    ├── items-screen
    |
    ├── survival-screen
    |
    └── result-screen



=================================================
-->




<div class="game">







<!--
=================================================

3. СТАРТОВЫЙ ЭКРАН


Первый экран, который видит игрок.


Содержит:

- название игры;
- описание ситуации;
- кнопку START.


После нажатия START:

этот экран будет скрываться,

а следующий экран появляться.


Управляться будет через game.js.


=================================================
-->





<div 
class="start-screen"
id="start-screen">







<!--
=================================================

4. НАЗВАНИЕ ИГРЫ


Главный заголовок.


Позже здесь можно добавить:

- логотип;
- анимацию;
- эффекты появления.


=================================================
-->




<!--
=================================================

4. НАЗВАНИЕ ИГРЫ


Главный логотип игры.


Структура:


🌴

SURVIVE

30 DAYS

THE LOST ISLAND



Разделяем название на несколько уровней:


SURVIVE

главное слово.


30 DAYS

главная цель игрока.


THE LOST ISLAND

атмосферный подзаголовок.


Такая структура лучше подходит
для мобильного игрового интерфейса.


=================================================
-->




<!--
=================================================

5. НАЧАЛЬНОЕ ОПИСАНИЕ


Первое сообщение игроку.


Позже здесь может быть:

- история катастрофы;
- описание острова;
- задача игрока.


=================================================
-->









<!--
=================================================

6. КНОПКА НАЧАЛА ИГРЫ


Первая кнопка.


После нажатия:

START

будет запускать:

- создание персонажа;
- выбор характеристик;
- выбор предметов.


Функция будет находиться:

game.js


=================================================
-->




<button 
class="start-button"
id="start-button">


START GAME


</button>






</div>








<!--
=================================================

7. ЭКРАНЫ ИГРЫ


Здесь будут находиться
следующие экраны игры.


Сейчас добавлен:

character-screen


Он появляется после:

START GAME


Игрок должен выбрать:

- Boy
- Girl



Будущие экраны:


items-screen

Выбор:

- 4 предметов для выживания.



survival-screen

Основная игра:

- день 1;
- день 2;
- ...
- день 30.



result-screen

Финальный результат:

- выжил;
- погиб;
- построил убежище;
- спасся.


=================================================
-->







<!--
=================================================

CHARACTER SCREEN


ЭКРАН ВЫБОРА ПЕРСОНАЖА


Второй экран игры.


Задача экрана:


Показать игроку выбор:

- кто он будет;
- какого персонажа выбрать.


Структура:


character-screen

        |
        |
        ├── заголовок

        |
        ├── Boy

        |
        └── Girl



Изображения находятся:


graphics/

    |
    ├── man1.png

    |
    └── girl1.png



Логика выбора будет добавлена позже
в файле:

game.js


=================================================
-->



<div 
class="character-screen"
id="character-screen">





<!--
=================================================

ЗАГОЛОВОК ЭКРАНА


Текст выбора персонажа.


=================================================
-->











<!--
=================================================

КОНТЕЙНЕР ПЕРСОНАЖЕЙ


Содержит две карточки:


левая:

Boy


правая:

Girl



=================================================
-->



<div class="characters">







<!--
=================================================

BOY CHARACTER


Мужской персонаж.


Файл изображения:


graphics/man1.png


=================================================
-->



<div 
class="character-card"
id="boy-character">



<img

src="graphics/man1.png"

alt="Boy character"

>



<p>

Boy

</p>



</div>







<!--
=================================================

GIRL CHARACTER


Женский персонаж.


Файл изображения:


graphics/gerl1.png


=================================================
-->



<div 
class="character-card"
id="girl-character">



<img

src="graphics/girl1.png"

alt="Girl character"

>



<p>

Girl

</p>



</div>





</div>





</div>


<!--
=================================================

INTRO SCREEN


ЭКРАН 3 — ИСТОРИЯ ПЕРСОНАЖА


Появляется после выбора:

Boy
или
Girl


Использует изображения:


graphics/man2.png

или

graphics/girl2.png



Сейчас экран содержит только:

- изображение персонажа.


Позже здесь добавим:

- историю;
- описание ситуации;
- кнопку CHOOSE ITEMS.



=================================================
-->



<div

class="intro-screen"

id="intro-screen">





<!--
=================================================

ИЗОБРАЖЕНИЕ ПЕРСОНАЖА


Файл будет меняться через game.js.


Если выбран парень:


graphics/man2.png



Если выбрана девушка:


graphics/girl2.png


=================================================
-->



<img

id="intro-image"

src="graphics/man2.png"

alt="Character intro"

>

>



</div>











<!--
=================================================

8. ПОДКЛЮЧЕНИЕ ИГРОВОЙ ЛОГИКИ


game.js отвечает за:


- переходы между экранами;
- кнопки;
- события;
- дни выживания;
- здоровье;
- воду;
- еду;
- огонь;
- очки;
- результат.


index.html только показывает элементы.


=================================================
-->





<script src="game.js"></script>







</body>


</html>
