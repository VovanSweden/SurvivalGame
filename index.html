<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SurvivalGame</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="game">


<!-- SCREEN-001 START SCREEN -->

<section 
class="start-screen"
id="screen-001">

<button
class="image-start-button"
id="button-screen-001-01">
</button>

</section>



<!-- SCREEN-002 CHARACTER CHOICE -->

<section
class="character-screen"
id="screen-002">


<button
class="character-hotspot boy-hotspot"
id="button-screen-002-01">
</button>


<button
class="character-hotspot girl-hotspot"
id="button-screen-002-02">
</button>


</section>




<!-- SCREEN-003 CHARACTER INTRO START -->

<section
class="intro-character-screen"
id="screen-003">


<img
id="intro-character-image"
src="graphics/man Start.png"
alt="Selected character">


<button
class="character-start-button"
id="button-screen-003-01">
</button>


</section>




<!-- SCREEN-004 CHARACTER INTRO RESULT -->

<section
class="final-character-screen"
id="screen-004">


<img
id="final-character-image"
src="graphics/man1.png"
alt="Final character">


<button
class="final-character-next-button"
id="button-screen-004-01">
</button>


</section>




<!-- SCREEN-005 LOCATION MAP -->

<section
class="location-screen"
id="screen-005">


<button
class="location-hotspot location-1"
id="button-screen-005-01">
</button>


<button
class="location-hotspot location-2"
id="button-screen-005-02">
</button>


<button
class="location-hotspot location-3"
id="button-screen-005-03">
</button>


<button
class="location-hotspot location-4"
id="button-screen-005-04">
</button>


</section>







<!--

GAME LOGIC:

game.js handles:

BUTTON ACTION

GAME STATE changes

SCREEN transitions

-->


<!--
=================================================

SCREEN-006

COCONUT GROVE INTRO


ASSET:

LOCAL COCONUT intro.png


BUTTON:

button-screen-006-01


STATE READ:

gameState.character

gameState.location


OUTPUT:

SCREEN-010


=================================================
-->

<section
class="location-scene-screen"
id="screen-006">


<img

src="graphics/LOCAL COCONUT intro.png"

alt="Coconut Grove">


<button

class="location-next-button"

id="button-screen-006-01">

</button>


</section>





<!--
=================================================

SCREEN-007

MOUNTAIN LAKE INTRO


ASSET:

LOCAL LAKE intro.png


BUTTON:

button-screen-007-01


STATE READ:

gameState.character

gameState.location


OUTPUT:

SCREEN-010


=================================================
-->

<section
class="location-scene-screen"
id="screen-007">


<img

src="graphics/LOCAL LAKE intro.png"

alt="Mountain Lake">


<button

class="location-next-button"

id="button-screen-007-01">

</button>


</section>





<!--
=================================================

SCREEN-008

BAMBOO GROVE INTRO


ASSET:

LOCAL BAMBOO intro.png


BUTTON:

button-screen-008-01


STATE READ:

gameState.character

gameState.location


OUTPUT:

SCREEN-010


=================================================
-->

<section
class="location-scene-screen"
id="screen-008">


<img

src="graphics/LOCAL BAMBOO intro.png"

alt="Bamboo Grove">


<button

class="location-next-button"

id="button-screen-008-01">

</button>


</section>





<!--
=================================================

SCREEN-009

BANANA PLANTATION INTRO


ASSET:

LOCAL BANANA intro.png


BUTTON:

button-screen-009-01


STATE READ:

gameState.character

gameState.location


OUTPUT:

SCREEN-010


=================================================
-->

<section
class="location-scene-screen"
id="screen-009">


<img

src="graphics/LOCAL BANANA intro.png"

alt="Banana Plantation">


<button

class="location-next-button"

id="button-screen-009-01">

</button>


</section>





<!--
=================================================

SCREEN-010

LOCATION CHARACTER RESULT


ASSET:

selected by:

gameState.location

+

gameState.character


BUTTON:

button-screen-010-01


OUTPUT:

SCREEN-011


=================================================
-->

<section
class="location-scene-screen"
id="screen-010">


<img
id="location-character-image"
src=""
alt="Location character">


<button

class="location-next-button"

id="button-screen-010-01">

</button>


</section>





<!--
=================================================

SCREEN-011

FIRST SURVIVAL EVENT


ASSET:

background_day0


FILE:

graphics/fon day0.png


BUTTON:

button-screen-011-01


STATE READ:

gameState.character

gameState.location

gameState.day


STATE WRITE:

gameState.day


OUTPUT:

SCREEN-012


=================================================
-->



<section
class="location-scene-screen"
id="screen-011">


<img

src="graphics/fon day0.png"

alt="Day 0 Story Intro">


<button

class="location-next-button"

id="button-screen-011-01">

</button>


</section>



<!-- SCREEN-012 DAY 1 CHOOSE ITEMS -->

<section
class="day1-screen"
id="screen-012">

<img
src="graphics/fon day1.png"
alt="Day 1">

<button
class="item-selection-button"
id="button-screen-012-01">
</button>

</section>




<!-- SCREEN-013 ITEM SELECTION -->

<section
class="item-selection-screen"
id="screen-013">

<img
id="item-character-image"
src=""
alt="Choose items">

<button
class="location-next-button"
id="button-screen-013-01">
</button>

</section>



<!-- SCREEN-014 ITEM SELECTION RESULT -->

<section
class="item-result-screen"
id="screen-014">

<img
id="item-result-character-image"
src=""
alt="Items selected">

<button
class="location-next-button"
id="button-screen-014-01">
</button>

</section>








</div>



<script src="game.js"></script>


</body>

</html>
