<!DOCTYPE html>
<html lang="en">


<head>


<meta charset="UTF-8">



<!--
=================================================

SURVIVE 30 DAYS


ФАЙЛ:

index.html


НАЗНАЧЕНИЕ:


Этот файл отвечает только за структуру игры.


Здесь мы создаём экраны игры.


Сейчас существуют:


SCREEN 1

START GAME


SCREEN 2

CHOOSE YOUR CHARACTER



Здесь НЕТ:


- логики переходов;
- выбора персонажа;
- игровых расчётов;
- дней выживания;
- событий.


За переходы отвечает:


game.js



За внешний вид отвечает:


style.css



=================================================
-->




<!--

Эта строка нужна для правильного отображения
игры на телефонах.


Она говорит браузеру:

использовать настоящую ширину экрана устройства.


-->

<meta name="viewport" content="width=device-width, initial-scale=1.0">



<title>

Survive 30 Days

</title>



<!--

Подключаем файл дизайна.


Все цвета, размеры, расположение,
фоновые картинки находятся здесь:


style.css


-->

<link rel="stylesheet" href="style.css">



</head>





<body>





<!--
=================================================

ГЛАВНЫЙ КОНТЕЙНЕР ИГРЫ


Все игровые экраны находятся внутри:

.game


Сейчас:


.game

    |
    |
    ├── SCREEN 1
    |
    |
    └── SCREEN 2



Позже сюда будут добавлены:

SCREEN 3

SCREEN 4

и так далее.


=================================================
-->



<div class="game">







<!--
=================================================

SCREEN 1


START SCREEN


Теперь первый экран содержит
только фоновую картинку.


Вся надпись:

SURVIVE
30 DAYS
START GAME


уже находится внутри изображения:


graphics/fon1.png



HTML больше не рисует текст.


Невидимая кнопка находится
поверх нарисованной кнопки START GAME.



Нажатие:


START GAME на картинке


↓

SCREEN 2


CHOOSE YOUR CHARACTER



=================================================
-->

<section

class="start-screen"

id="start-screen">



<!--

Невидимая кнопка.


Игрок её не видит.


Она расположена поверх
нарисованной кнопки START GAME.


ID нужен для game.js.



-->

<button

class="image-start-button"

id="start-button">


</button>



</section>








<!--
=================================================

SCREEN 2


CHOOSE YOUR CHARACTER


ВТОРОЙ ЭКРАН ИГРЫ



Фоновая картинка:


graphics/fon2.png



На экране:


ЛЕВАЯ СТОРОНА:


BOY


Картинка:


graphics/man1.png




ПРАВАЯ СТОРОНА:


GIRL


Картинка:


graphics/girl1.png




Сейчас создаём:


- расположение;
- картинки;
- невидимые кнопки.


Позже:


нажатие BOY


↓

graphics/man start.png



нажатие GIRL


↓

graphics/girl start.png



=================================================
-->





<section


class="character-screen"


id="character-screen">








<!--

Заголовок второго экрана.


-->



<h2>


CHOOSE YOUR CHARACTER


</h2>









<!--

Контейнер двух персонажей.


ВАЖНО:


Здесь должен быть только один


<div class="characters">


Он содержит:


BOY

и

GIRL



-->



<div class="characters">







<!--
=================================================

BOY


Карточка персонажа.


Изображение:


graphics/man1.png



Внутри есть:


1.
Картинка


2.
Невидимая кнопка


3.
Название BOY



Невидимая кнопка нужна,
чтобы игрок нажимал
на область персонажа.


=================================================
-->



<div class="character-card">






<img


src="graphics/man1.png"


alt="Boy character">







<!--

Невидимая кнопка.


Сейчас она пустая.


Она будет находиться поверх картинки.


game.js будет искать:


id="boy-choice"



После нажатия:


переход на:


man start.png



-->



<button


class="character-button"


id="boy-choice">


</button>







<p>


BOY


</p>






</div>











<!--
=================================================

GIRL


Карточка персонажа.


Изображение:


graphics/girl1.png



Невидимая кнопка:


id="girl-choice"



После нажатия:


переход на:


girl start.png



=================================================
-->




<div class="character-card">






<img


src="graphics/girl1.png"


alt="Girl character">







<button


class="character-button"


id="girl-choice">


</button>







<p>


GIRL


</p>







</div>






<!--

ЗАКРЫТИЕ КОНТЕЙНЕРА:


.characters



Здесь закончились:

BOY

и

GIRL


-->



</div>








</section>





<!--
=================================================

SCREEN 3


INTRO CHARACTER START


После выбора персонажа
появляется отдельный экран.


Если выбран BOY:


graphics/man start.png



Если выбрана GIRL:


graphics/girl start.png



Этот экран пока показывает
только изображение персонажа.


Позже здесь появится:

- история;
- текст;
- кнопка продолжения.


=================================================
-->



<section

class="intro-character-screen"

id="intro-character-screen">



<img

id="intro-character-image"

src="graphics/man start.png"

alt="Selected character">



</section>









<!--

ПОДКЛЮЧЕНИЕ ЛОГИКИ ИГРЫ.


Этот файл отвечает за:


- нажатие START GAME;
- выбор BOY;
- выбор GIRL;
- переходы между экранами.



-->



<script src="game.js"></script>






</body>



</html>
