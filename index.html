<!DOCTYPE html>
<html lang="en">


<head>


<meta charset="UTF-8">


<!--
=================================================

SURVIVE 30 DAYS

ФАЙЛ:

index.html


НАЗНАЧЕНИЕ:


Этот файл отвечает только за структуру игры.


Здесь находятся игровые экраны:


SCREEN 1

START SCREEN


SCREEN 2

CHOOSE YOUR CHARACTER


SCREEN 3

INTRO CHARACTER START



Здесь НЕТ:

- игровой логики;
- расчёта дней;
- событий;
- предметов.


Переходы находятся в:

game.js


Внешний вид находится в:

style.css


=================================================
-->



<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>

Survive 30 Days

</title>



<link rel="stylesheet" href="style.css">



</head>





<body>




<!--
=================================================

ГЛАВНЫЙ КОНТЕЙНЕР ИГРЫ


Все экраны находятся внутри:

.game


=================================================
-->



<div class="game">







<!--
=================================================

SCREEN 1

START SCREEN


ФОН:


graphics/fon1.png



ВАЖНО:


Вся графика уже находится внутри картинки:


- название игры;
- кнопка START GAME.



HTML ничего не рисует.


Есть только прозрачная кнопка.


При нажатии:


START GAME


↓

SCREEN 2


=================================================
-->



<section

class="start-screen"

id="start-screen">



<!--

Невидимая кнопка.


Она лежит поверх нарисованной кнопки
START GAME внутри fon1.png.


ID используется в game.js.


-->

<button

class="image-start-button"

id="start-button">

</button>



</section>









<!--
=================================================

SCREEN 2

CHOOSE YOUR CHARACTER


ФОН:


graphics/fon2.png



Вся картинка находится в одном файле.


HTML НЕ содержит:


- текста;
- персонажей;
- рамок.



Есть только две зоны нажатия.


Левая половина:


BOY



Правая половина:


GIRL



=================================================
-->



<section

class="character-screen"

id="character-screen">






<!--

НЕВИДИМАЯ ЗОНА ПАРНЯ


Нажатие:


BOY


↓

SCREEN 3


↓

graphics/man start.png


-->



<button

class="character-hotspot boy-hotspot"

id="boy-choice">

</button>







<!--

НЕВИДИМАЯ ЗОНА ДЕВУШКИ


Нажатие:


GIRL


↓

SCREEN 3


↓

graphics/girl start.png


-->



<button

class="character-hotspot girl-hotspot"

id="girl-choice">

</button>





</section>









<!--
=================================================

SCREEN 3

INTRO CHARACTER START


После выбора персонажа
открывается новая картинка.


Если выбран BOY:


graphics/man start.png



Если выбран GIRL:


graphics/girl start.png



=================================================
-->



<section

class="intro-character-screen"

id="intro-character-screen">





<img

id="intro-character-image"

src="graphics/man start.png"

alt="Selected character">





</section>









</div>









<!--

ПОДКЛЮЧЕНИЕ ЛОГИКИ ИГРЫ


game.js отвечает за:


- START GAME;
- выбор BOY;
- выбор GIRL;
- переходы между экранами.


-->



<script src="game.js"></script>





</body>


</html>
