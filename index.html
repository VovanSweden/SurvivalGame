<!--
=================================================

SCREEN 1

START SCREEN


Первый экран игры.


Фоновая картинка:

graphics/fon1.png


На самой картинке уже находятся:

- название игры;
- кнопка START GAME.


HTML не создаёт текст и изображения.


Здесь только одна невидимая кнопка.


При нажатии:

SCREEN 1

↓

SCREEN 2


=================================================
-->


<section

class="start-screen"

id="start-screen">



<!--

Невидимая область на кнопке START GAME.


Игрок её не видит.


Она находится поверх нарисованной кнопки
в файле fon1.png.


ID нужен для game.js.


-->

<button

class="image-start-button"

id="start-button">

</button>



</section>









<!--
=================================================

SCREEN 2

CHOOSE YOUR CHARACTER


Фон:

graphics/fon2.png


Вся графика находится внутри картинки.


HTML НЕ содержит:


- текст;
- изображения персонажей;
- рамки.


Только две невидимые области:


левая сторона:

BOY


правая сторона:

GIRL



=================================================
-->


<section

class="character-screen"

id="character-screen">





<!--

Невидимая зона выбора парня.


При нажатии:


BOY

↓

SCREEN 3

↓

graphics/man start.png


-->

<button

class="character-hotspot boy-hotspot"

id="boy-choice">

</button>







<!--

Невидимая зона выбора девушки.


При нажатии:


GIRL

↓

SCREEN 3

↓

graphics/girl start.png


-->

<button

class="character-hotspot girl-hotspot"

id="girl-choice">

</button>





</section>









<!--
=================================================

SCREEN 3

INTRO CHARACTER START


После выбора персонажа
открывается полноэкранное изображение.


Если выбран парень:


graphics/man start.png



Если выбрана девушка:


graphics/girl start.png



=================================================
-->


<section

class="intro-character-screen"

id="intro-character-screen">





<img

id="intro-character-image"

src="graphics/man start.png"

alt="Selected character">





</section>
